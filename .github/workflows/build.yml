name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - run: npm ci
    - run: |
        npx cap telemetry off
        rm -rf android
        npx cap add android
        npx cap sync android
    - run: |
        mkdir -p android/app/src/main/java/com/cvetik/vpn
        cat > android/app/src/main/java/com/cvetik/vpn/CvetikVpnPlugin.kt << 'KTEOF'
        package com.cvetik.vpn
        import android.app.Activity
        import android.content.Intent
        import android.net.VpnService
        import android.os.Build
        import com.getcapacitor.JSObject
        import com.getcapacitor.Plugin
        import com.getcapacitor.PluginCall
        import com.getcapacitor.PluginMethod
        import com.getcapacitor.annotation.CapacitorPlugin
        import java.net.InetAddress
        import java.io.BufferedReader
        import java.io.StringReader
        @CapacitorPlugin(name = "CvetikVpn")
        class CvetikVpnPlugin : Plugin() {
            private val VPN_REQUEST_CODE = 1001
            private var pendingCall: PluginCall? = null
            private var pendingEndpoint = ""
            private var pendingName = ""
            private var pendingConf = ""

            @PluginMethod
            fun connect(call: PluginCall) {
                val endpoint = call.getString("endpoint", "") ?: ""
                val name = call.getString("name", "CVETIK-VPN") ?: "CVETIK-VPN"
                val conf = call.getString("conf", "") ?: ""
                if (endpoint.isEmpty()) { call.reject("No endpoint"); return }
                pendingEndpoint = endpoint
                pendingName = name
                pendingConf = conf
                val intent = VpnService.prepare(context)
                if (intent != null) {
                    pendingCall = call
                    startActivityForResult(call, intent, VPN_REQUEST_CODE)
                } else {
                    startVpnService(endpoint, name, conf)
                    val ret = JSObject(); ret.put("status", "connected"); call.resolve(ret)
                }
            }

            @PluginMethod
            fun disconnect(call: PluginCall) {
                val intent = Intent(context, CvetikVpnService::class.java)
                intent.action = CvetikVpnService.ACTION_DISCONNECT
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(intent)
                else context.startService(intent)
                val ret = JSObject(); ret.put("status", "disconnected"); call.resolve(ret)
            }

            @PluginMethod
            fun getStats(call: PluginCall) {
                val ret = JSObject()
                ret.put("rx", CvetikVpnService.totalRx)
                ret.put("tx", CvetikVpnService.totalTx)
                ret.put("connected", CvetikVpnService.isRunning)
                call.resolve(ret)
            }

            @PluginMethod
            fun ping(call: PluginCall) {
                val host = call.getString("host", "") ?: ""
                if (host.isEmpty()) { call.reject("No host"); return }
                Thread {
                    try {
                        val start = System.currentTimeMillis()
                        val reachable = InetAddress.getByName(host).isReachable(3000)
                        val ms = if (reachable) System.currentTimeMillis() - start else 999
                        val ret = JSObject()
                        ret.put("ms", ms)
                        ret.put("reachable", reachable)
                        call.resolve(ret)
                    } catch (e: Exception) {
                        val ret = JSObject()
                        ret.put("ms", 999)
                        ret.put("reachable", false)
                        call.resolve(ret)
                    }
                }.start()
            }

            private fun startVpnService(endpoint: String, name: String, conf: String) {
                val intent = Intent(context, CvetikVpnService::class.java)
                intent.action = CvetikVpnService.ACTION_CONNECT
                intent.putExtra("endpoint", endpoint)
                intent.putExtra("name", name)
                intent.putExtra("conf", conf)
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(intent)
                else context.startService(intent)
            }

            override fun handleOnActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.handleOnActivityResult(requestCode, resultCode, data)
                if (requestCode == VPN_REQUEST_CODE) {
                    val call = pendingCall; pendingCall = null
                    if (resultCode == Activity.RESULT_OK) {
                        startVpnService(pendingEndpoint, pendingName, pendingConf)
                        val ret = JSObject(); ret.put("status", "connected"); call?.resolve(ret)
                    } else {
                        val ret = JSObject()
                        ret.put("status", "permission_denied")
                        ret.put("error", "User denied VPN permission")
                        call?.resolve(ret)
                    }
                }
            }
        }
        KTEOF
        cat > android/app/src/main/java/com/cvetik/vpn/CvetikVpnService.kt << 'KTEOF'
        package com.cvetik.vpn
        import android.app.NotificationChannel
        import android.app.NotificationManager
        import android.app.PendingIntent
        import android.content.Intent
        import android.net.VpnService
        import android.os.Build
        import android.os.ParcelFileDescriptor
        import android.util.Log
        import androidx.core.app.NotificationCompat
        import java.io.FileInputStream
        import java.io.FileOutputStream
        import java.net.InetSocketAddress
        import java.net.Socket
        class CvetikVpnService : VpnService() {
            companion object {
                const val ACTION_CONNECT = "com.cvetik.vpn.CONNECT"
                const val ACTION_DISCONNECT = "com.cvetik.vpn.DISCONNECT"
                const val CHANNEL_ID = "cvetik_vpn_channel"
                const val NOTIFICATION_ID = 1337
                @JvmStatic var totalRx = 0L
                @JvmStatic var totalTx = 0L
                @JvmStatic @Volatile var isRunning = false
            }
            private var vpnInterface: ParcelFileDescriptor? = null
            private var vpnThread: Thread? = null
            @Volatile private var running = false
            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                when (intent?.action) {
                    ACTION_CONNECT -> {
                        val endpoint = intent.getStringExtra("endpoint") ?: return START_NOT_STICKY
                        val name = intent.getStringExtra("name") ?: "CVETIK-VPN"
                        val conf = intent.getStringExtra("conf") ?: ""
                        connect(endpoint, name, conf)
                    }
                    ACTION_DISCONNECT -> disconnect()
                }
                return START_NOT_STICKY
            }
            private fun connect(endpoint: String, name: String, conf: String) {
                if (running) return
                running = true; isRunning = true; totalRx = 0L; totalTx = 0L
                startForeground(name)
                val parts = endpoint.split(":")
                val host = parts[0]
                val port = parts.getOrNull(1)?.toIntOrNull() ?: 4500
                vpnThread = Thread {
                    var socket: Socket? = null
                    try {
                        val builder = Builder()
                        builder.setSession(name)
                        if (conf.isNotEmpty()) {
                            // Parse WireGuard-like config for addresses and DNS
                            val lines = conf.lines()
                            for (line in lines) {
                                when {
                                    line.startsWith("Address=") -> {
                                        val addr = line.substringAfter("=").split(",")[0].trim()
                                        if ("/" in addr) {
                                            val ip = addr.substringBefore("/")
                                            val prefix = addr.substringAfter("/").toIntOrNull() ?: 24
                                            builder.addAddress(ip, prefix)
                                        } else {
                                            builder.addAddress(addr, 24)
                                        }
                                    }
                                    line.startsWith("DNS=") -> {
                                        val dnsList = line.substringAfter("=").split(",")
                                        for (dns in dnsList) builder.addDnsServer(dns.trim())
                                    }
                                    line.startsWith("MTU=") -> {
                                        line.substringAfter("=").toIntOrNull()?.let { builder.setMtu(it) }
                                    }
                                }
                            }
                        } else {
                            builder.addAddress("10.200.200.2", 24)
                            builder.addDnsServer("1.1.1.1")
                            builder.addDnsServer("8.8.8.8")
                        }
                        builder.addRoute("0.0.0.0", 0)
                        builder.setMtu(1400)
                        builder.setBlocking(true)
                        vpnInterface = builder.establish()
                        if (vpnInterface == null) { running = false; isRunning = false; return@Thread }
                        socket = Socket()
                        socket.connect(InetSocketAddress(host, port), 15000)
                        protect(socket)
                        val vpnIn = FileInputStream(vpnInterface!!.fileDescriptor)
                        val vpnOut = FileOutputStream(vpnInterface!!.fileDescriptor)
                        val sockIn = socket.getInputStream()
                        val sockOut = socket.getOutputStream()
                        val t1 = Thread {
                            val buf = ByteArray(32767)
                            try { while (running) {
                                val n = vpnIn.read(buf)
                                if (n > 0) { totalTx += n; sockOut.write(buf, 0, n); sockOut.flush() }
                                else if (n < 0) break
                            }} catch (e: Exception) {}
                        }
                        val t2 = Thread {
                            val buf = ByteArray(32767)
                            try { while (running) {
                                val n = sockIn.read(buf)
                                if (n > 0) { totalRx += n; vpnOut.write(buf, 0, n); vpnOut.flush() }
                                else if (n < 0) break
                            }} catch (e: Exception) {}
                        }
                        t1.start(); t2.start(); t1.join(); t2.join()
                    } catch (e: Exception) { Log.e("CVETIK", "VPN error: ${e.message}")
                    } finally {
                        running = false; isRunning = false
                        try { socket?.close() } catch (_: Exception) {}
                        try { vpnInterface?.close() } catch (_: Exception) {}
                        vpnInterface = null; stopForeground(true); stopSelf()
                    }
                }
                vpnThread?.start()
            }
            private fun disconnect() {
                running = false; isRunning = false
                vpnThread?.interrupt()
                try { vpnInterface?.close() } catch (_: Exception) {}
                vpnInterface = null; stopForeground(true); stopSelf()
            }
            private fun startForeground(name: String) {
                val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    val channel = NotificationChannel(CHANNEL_ID, "CVETIK-VPN", NotificationManager.IMPORTANCE_LOW)
                    channel.description = "VPN tunnel status"
                    nm.createNotificationChannel(channel)
                }
                val intent = packageManager.getLaunchIntentForPackage(packageName)
                val pendingIntent = PendingIntent.getActivity(this, 0, intent,
                    PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                    .setContentTitle(name)
                    .setContentText("Туннель активен • Перенаправление трафика")
                    .setSmallIcon(android.R.drawable.ic_lock_idle_lock)
                    .setContentIntent(pendingIntent)
                    .setOngoing(true)
                    .build()
                startForeground(NOTIFICATION_ID, notification)
            }
            override fun onDestroy() { disconnect(); super.onDestroy() }
        }
        KTEOF
        cat > android/app/src/main/java/com/cvetik/vpn/MainActivity.kt << 'KTEOF'
        package com.cvetik.vpn
        import android.os.Bundle
        import com.getcapacitor.BridgeActivity
        class MainActivity : BridgeActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                registerPlugin(CvetikVpnPlugin::class.java)
                super.onCreate(savedInstanceState)
            }
        }
        KTEOF
    - run: |
        cat > android/app/src/main/AndroidManifest.xml << 'MANEOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.cvetik.vpn">
        <uses-permission android:name="android.permission.INTERNET"/>
        <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
        <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
        <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
        <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
        <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="@string/app_name" android:roundIcon="@mipmap/ic_launcher_round" android:supportsRtl="true" android:theme="@style/AppTheme">
        <activity android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode" android:name="com.cvetik.vpn.MainActivity" android:label="@string/title_activity_main" android:theme="@style/AppTheme.NoActionBarLaunch" android:launchMode="singleTask" android:exported="true">
        <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
        <intent-filter>
            <action android:name="android.intent.action.VIEW"/>
            <category android:name="android.intent.category.DEFAULT"/>
            <category android:name="android.intent.category.BROWSABLE"/>
            <data android:scheme="file" android:mimeType="*/*" android:pathPattern=".*\.conf"/>
            <data android:scheme="content" android:mimeType="*/*" android:pathPattern=".*\.conf"/>
        </intent-filter>
        </activity>
        <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true">
        <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/>
        </provider>
        <service android:name="com.cvetik.vpn.CvetikVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="true" android:foregroundServiceType="specialUse">
        <intent-filter><action android:name="android.net.VpnService"/></intent-filter>
        </service>
        </application>
        </manifest>
        MANEOF
    - run: |
        sed -i '/implementation project.*capacitor-android/a \    implementation "androidx.core:core-ktx:1.12.0"' android/app/build.gradle
    - run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: cvetik-vpn-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
