<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CVETIK-VPN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* Header */
.header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#161b22;border-bottom:1px solid #30363d}
.logo{font-size:18px;font-weight:700;background:linear-gradient(90deg,#e63946,#457b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.server-btn{background:#21262d;border:1px solid #30363d;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.server-btn:active{background:#30363d}

/* Server selector */
.server-panel{position:fixed;top:56px;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:100;display:none;flex-direction:column;align-items:center;padding:20px}
.server-panel.on{display:flex}
.panel-box{background:#161b22;border:1px solid #30363d;border-radius:16px;width:100%;max-width:400px;max-height:70vh;overflow:hidden;display:flex;flex-direction:column}
.panel-head{padding:16px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:16px;font-weight:600}
.panel-close{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;width:32px;height:32px}
.server-list{overflow-y:auto;flex:1;padding:8px}
.server-item{display:flex;align-items:center;padding:12px;margin:4px 8px;border-radius:10px;background:#21262d;cursor:pointer;transition:0.15s}
.server-item:active{background:#30363d;transform:scale(0.98)}
.server-item.on{background:rgba(46,204,113,0.15);border:1px solid rgba(46,204,113,0.3)}
.server-flag{width:36px;height:36px;border-radius:8px;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:18px;margin-right:12px;flex-shrink:0}
.server-info{flex:1;min-width:0}
.server-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.server-addr{font-size:11px;color:#8b949e;margin-top:2px}
.server-ping{font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;flex-shrink:0;margin-left:8px}
.ping-good{background:rgba(46,204,113,0.15);color:#2ecc71}
.ping-mid{background:rgba(241,196,15,0.15);color:#f1c40f}
.ping-bad{background:rgba(230,57,70,0.15);color:#e63946}

/* Main */
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative}

/* Status */
.status{text-align:center;margin-bottom:30px}
.status-dot{width:10px;height:10px;border-radius:50%;background:#e63946;display:inline-block;margin-right:8px;box-shadow:0 0 12px #e63946}
.status-dot.on{background:#2ecc71;box-shadow:0 0 12px #2ecc71}
.status-title{font-size:20px;font-weight:700}
.status-sub{font-size:13px;color:#8b949e;margin-top:6px}

/* Connect button */
.connect-btn{width:140px;height:140px;border-radius:50%;border:none;background:linear-gradient(135deg,#e63946,#457b9d);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 32px rgba(230,57,70,0.4);transition:all 0.3s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.connect-btn:active{transform:scale(0.92)}
.connect-btn.on{background:linear-gradient(135deg,#2ecc71,#27ae60);box-shadow:0 8px 32px rgba(46,204,113,0.4)}
.connect-icon{font-size:32px}
.connect-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:0.9}

/* Stats */
.stats{display:flex;gap:20px;margin-top:24px;opacity:0;transform:translateY(10px);transition:all 0.4s}
.stats.on{opacity:1;transform:translateY(0)}
.stat{text-align:center;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px 20px;min-width:80px}
.stat-val{font-size:18px;font-weight:800;background:linear-gradient(90deg,#e63946,#457b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-lab{font-size:10px;color:#8b949e;margin-top:2px;text-transform:uppercase}

/* Add server */
.add-btn{position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:#e63946;border:none;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(230,57,70,0.4);z-index:50}
.add-btn:active{transform:scale(0.9)}

/* Modal add */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal-box{background:#161b22;border:1px solid #30363d;border-radius:16px;width:100%;max-width:360px;padding:20px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.modal-input{width:100%;padding:12px 14px;background:#21262d;border:1px solid #30363d;border-radius:10px;color:#fff;font-size:14px;margin-bottom:10px}
.modal-input:focus{border-color:#e63946;outline:none}
.modal-btn{width:100%;padding:14px;background:linear-gradient(135deg,#e63946,#457b9d);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.modal-btn:active{transform:scale(0.97)}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(60px);background:#161b22;border:1px solid #30363d;padding:12px 24px;border-radius:24px;font-size:14px;z-index:300;opacity:0;transition:all 0.4s;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="header">
  <div class="logo">CVETIK-VPN</div>
  <button class="server-btn" onclick="toggleServers()">🌐 Серверы</button>
</div>

<div class="server-panel" id="serverPanel" onclick="if(event.target===this)toggleServers()">
  <div class="panel-box">
    <div class="panel-head">
      <div class="panel-title">Выберите сервер</div>
      <button class="panel-close" onclick="toggleServers()">✕</button>
    </div>
    <div class="server-list" id="serverList"></div>
  </div>
</div>

<div class="main">
  <div class="status">
    <div><span class="status-dot" id="statusDot"></span><span class="status-title" id="statusTitle">Отключено</span></div>
    <div class="status-sub" id="statusSub">Выберите сервер и подключитесь</div>
  </div>

  <button class="connect-btn" id="connectBtn" onclick="toggleConnect()">
    <span class="connect-icon" id="connectIcon">⚡</span>
    <span class="connect-label" id="connectLabel">ВКЛ</span>
  </button>

  <div class="stats" id="stats">
    <div class="stat"><div class="stat-val" id="downVal">0.0</div><div class="stat-lab">Download</div></div>
    <div class="stat"><div class="stat-val" id="upVal">0.0</div><div class="stat-lab">Upload</div></div>
    <div class="stat"><div class="stat-val" id="pingVal">--</div><div class="stat-lab">Ping</div></div>
  </div>
</div>

<button class="add-btn" onclick="showAdd()">+</button>

<div class="modal" id="addModal" onclick="if(event.target===this)hideAdd()">
  <div class="modal-box">
    <div class="modal-title">Добавить сервер</div>
    <input class="modal-input" id="addName" placeholder="Название (например: Германия)" type="text">
    <input class="modal-input" id="addAddr" placeholder="Адрес:порт (например: 1.2.3.4:4500)" type="text">
    <input class="modal-input" id="addFlag" placeholder="Флаг (emoji, например: 🇩🇪)" type="text">
    <button class="modal-btn" onclick="addServer()">Добавить</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// === SERVERS ===
let servers = JSON.parse(localStorage.getItem('cvetik_servers')) || [
  {n:"Пермь-2",e:"engage.cloudflareclient.com:4500",f:"🇷🇺",p:0},
  {n:"Германия",e:"de.tribukvy.ltd:4500",f:"🇩🇪",p:0},
  {n:"Нидерланды",e:"engage.cloudflareclient.com:4500",f:"🇳🇱",p:0},
  {n:"Польша",e:"engage.cloudflareclient.com:4500",f:"🇵🇱",p:0},
  {n:"ПротоколX",e:"engage.cloudflareclient.com:4500",f:"🔥",p:0},
  {n:"ПротоколX-1",e:"engage.cloudflareclient.com:4500",f:"🔥",p:0}
];
let active = parseInt(localStorage.getItem('cvetik_active')) || 0;
let connected = false;

function saveServers(){
  localStorage.setItem('cvetik_servers', JSON.stringify(servers));
  localStorage.setItem('cvetik_active', active);
}

function renderServers(){
  const list = document.getElementById('serverList');
  list.innerHTML = servers.map((s,i)=>{
    const on = i===active ? ' on' : '';
    const pingClass = s.p===0 ? '' : (s.p<100 ? 'ping-good' : (s.p<300 ? 'ping-mid' : 'ping-bad'));
    const pingText = s.p===0 ? '...' : s.p+' мс';
    return `<div class="server-item${on}" onclick="selectServer(${i})">
      <div class="server-flag">${s.f}</div>
      <div class="server-info">
        <div class="server-name">${s.n}</div>
        <div class="server-addr">${s.e}</div>
      </div>
      <div class="server-ping ${pingClass}">${pingText}</div>
    </div>`;
  }).join('');
}

function selectServer(i){
  active = i;
  saveServers();
  renderServers();
  if(connected){
    toast('🔄 Переподключаемся к '+servers[active].n+'...');
    toggleConnect();
    setTimeout(toggleConnect, 800);
  } else {
    document.getElementById('statusSub').textContent = servers[active].n+' • '+servers[active].e;
    toast('📍 Выбран: '+servers[active].n);
  }
}

function toggleServers(){
  document.getElementById('serverPanel').classList.toggle('on');
}

function showAdd(){
  document.getElementById('addModal').classList.add('on');
}
function hideAdd(){
  document.getElementById('addModal').classList.remove('on');
}
function addServer(){
  const n = document.getElementById('addName').value.trim();
  const e = document.getElementById('addAddr').value.trim();
  const f = document.getElementById('addFlag').value.trim() || '📡';
  if(!n || !e){toast('❌ Заполни все поля'); return;}
  servers.push({n,e,f,p:0});
  saveServers();
  renderServers();
  hideAdd();
  document.getElementById('addName').value='';
  document.getElementById('addAddr').value='';
  document.getElementById('addFlag').value='';
  toast('✅ Сервер добавлен');
}

// === PING ===
async function pingServer(url){
  const start = Date.now();
  try{
    await fetch('http://'+url.split(':')[0], {mode:'no-cors', signal: AbortSignal.timeout(3000)});
  }catch(e){}
  return Date.now() - start;
}

async function pingAll(){
  for(let i=0;i<servers.length;i++){
    const ms = await pingServer(servers[i].e);
    servers[i].p = ms > 3000 ? 999 : ms;
    renderServers();
  }
}

// === CONNECT ===
async function toggleConnect(){
  const btn = document.getElementById('connectBtn');
  const icon = document.getElementById('connectIcon');
  const label = document.getElementById('connectLabel');
  const dot = document.getElementById('statusDot');
  const title = document.getElementById('statusTitle');
  const sub = document.getElementById('statusSub');
  const stats = document.getElementById('stats');
  const s = servers[active];

  if(!connected){
    toast('⏳ Подключение к '+s.n+'...');
    try{
      if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CvetikVpn){
        const res = await window.Capacitor.Plugins.CvetikVpn.connect({endpoint:s.e, name:s.n});
        if(res.status === 'connected'){
          connected = true;
          btn.classList.add('on'); icon.textContent='✓'; label.textContent='ВЫКЛ';
          dot.classList.add('on'); title.textContent='Подключено'; sub.textContent=s.n+' • '+s.e;
          stats.classList.add('on'); startRealStats();
          toast('✅ Подключено к '+s.n);
        }else{toast('❌ Ошибка: '+(res.error||'unknown'));}
      }else{
        // Demo mode for web
        connected = true;
        btn.classList.add('on'); icon.textContent='✓'; label.textContent='ВЫКЛ';
        dot.classList.add('on'); title.textContent='Подключено (демо)'; sub.textContent=s.n+' • '+s.e;
        stats.classList.add('on'); startSim();
        toast('✅ Демо-режим: '+s.n);
      }
    }catch(e){toast('❌ '+e.message);}
  }else{
    try{if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CvetikVpn){
      await window.Capacitor.Plugins.CvetikVpn.disconnect();
    }}catch(e){}
    connected = false;
    btn.classList.remove('on'); icon.textContent='⚡'; label.textContent='ВКЛ';
    dot.classList.remove('on'); title.textContent='Отключено'; sub.textContent='Выберите сервер и подключитесь';
    stats.classList.remove('on'); stopSim(); stopRealStats();
    toast('❌ Отключено');
  }
}

// === STATS ===
let simInt, realInt;
function startSim(){
  if(simInt) clearInterval(simInt);
  simInt = setInterval(()=>{
    document.getElementById('downVal').textContent = (Math.random()*5+0.5).toFixed(1)+' МБ';
    document.getElementById('upVal').textContent = (Math.random()*2+0.1).toFixed(1)+' МБ';
  }, 1000);
}
function stopSim(){if(simInt){clearInterval(simInt);simInt=null;}}

function startRealStats(){
  if(realInt) clearInterval(realInt);
  realInt = setInterval(async()=>{
    try{
      if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CvetikVpn){
        const res = await window.Capacitor.Plugins.CvetikVpn.getStats();
        document.getElementById('downVal').textContent = fmtB(res.rx);
        document.getElementById('upVal').textContent = fmtB(res.tx);
      }
    }catch(e){}
  }, 1000);
}
function stopRealStats(){if(realInt){clearInterval(realInt);realInt=null;}}
function fmtB(b){if(!b||b<0)return'0.0';const mb=b/(1024*1024);if(mb<1)return(b/1024).toFixed(1)+' КБ';return mb.toFixed(1)+' МБ';}

// === TOAST ===
let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('on'), 2500);
}

// === INIT ===
renderServers();
document.getElementById('statusSub').textContent = servers[active] ? servers[active].n+' • '+servers[active].e : 'Добавьте сервер';
pingAll();
</script>
</body>
</html>
