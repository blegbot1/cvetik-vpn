plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.cvetik.vpn'
    compileSdk 34

    defaultConfig {
        applicationId "com.cvetik.vpn"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "5.0-wgtunnel"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.marsounjan:icmp4a:1.2.0'

    // WG Tunnel / WireGuard / AmneziaWG backend
    implementation 'com.wireguard.android:tunnel:1.0.20230418'

    // For AmneziaWG support - using tunnel library
    implementation 'com.github.zaneschepke:wgtunnel:3.6.4'
}
