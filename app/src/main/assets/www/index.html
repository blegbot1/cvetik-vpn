<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CVETIK-VPN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column}

.header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#161b22;border-bottom:1px solid #30363d}
.logo{font-size:18px;font-weight:700;background:linear-gradient(90deg,#e63946,#457b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.server-btn{background:#21262d;border:1px solid #30363d;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.server-btn:active{background:#30363d}

.server-panel{position:fixed;top:56px;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:100;display:none;flex-direction:column;align-items:center;padding:20px}
.server-panel.on{display:flex}
.panel-box{background:#161b22;border:1px solid #30363d;border-radius:16px;width:100%;max-width:400px;max-height:75vh;overflow:hidden;display:flex;flex-direction:column}
.panel-head{padding:16px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:16px;font-weight:600}
.panel-close{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;width:32px;height:32px}
.server-list{overflow-y:auto;flex:1;padding:8px}
.server-item{display:flex;align-items:center;padding:12px;margin:4px 8px;border-radius:10px;background:#21262d;cursor:pointer;transition:0.15s}
.server-item:active{background:#30363d;transform:scale(0.98)}
.server-item.on{background:rgba(46,204,113,0.15);border:1px solid rgba(46,204,113,0.3)}
.server-flag{width:36px;height:36px;border-radius:8px;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:18px;margin-right:12px;flex-shrink:0}
.server-info{flex:1;min-width:0}
.server-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.server-addr{font-size:11px;color:#8b949e;margin-top:2px}
.server-ping{font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;flex-shrink:0;margin-left:8px}
.ping-good{background:rgba(46,204,113,0.15);color:#2ecc71}
.ping-mid{background:rgba(241,196,15,0.15);color:#f1c40f}
.ping-bad{background:rgba(230,57,70,0.15);color:#e63946}
.ping-load{background:rgba(255,255,255,0.05);color:#8b949e;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.status{text-align:center;margin-bottom:30px}
.status-dot{width:10px;height:10px;border-radius:50%;background:#e63946;display:inline-block;margin-right:8px;box-shadow:0 0 12px #e63946}
.status-dot.on{background:#2ecc71;box-shadow:0 0 12px #2ecc71}
.status-title{font-size:20px;font-weight:700}
.status-sub{font-size:13px;color:#8b949e;margin-top:6px}

.connect-btn{width:130px;height:130px;border-radius:50%;border:none;background:linear-gradient(135deg,#e63946,#457b9d);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 32px rgba(230,57,70,0.4);transition:all 0.3s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.connect-btn:active{transform:scale(0.92)}
.connect-btn.on{background:linear-gradient(135deg,#2ecc71,#27ae60);box-shadow:0 8px 32px rgba(46,204,113,0.4)}
.connect-icon{font-size:28px}
.connect-label{font-size:11px;text-transform:uppercase;letter-spacing:1px}

.stats{display:flex;gap:16px;margin-top:24px;opacity:0;transform:translateY(10px);transition:all 0.4s}
.stats.on{opacity:1;transform:translateY(0)}
.stat{text-align:center;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px 18px;min-width:70px}
.stat-val{font-size:16px;font-weight:800;background:linear-gradient(90deg,#e63946,#457b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-lab{font-size:10px;color:#8b949e;margin-top:2px;text-transform:uppercase}

.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(60px);background:#161b22;border:1px solid #30363d;padding:12px 24px;border-radius:24px;font-size:14px;z-index:300;opacity:0;transition:all 0.4s;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="header">
  <div class="logo">CVETIK-VPN</div>
  <button class="server-btn" onclick="toggleServers()">🌐 Туннели</button>
</div>

<div class="server-panel" id="serverPanel" onclick="if(event.target===this)toggleServers()">
  <div class="panel-box">
    <div class="panel-head">
      <div class="panel-title">Выберите туннель</div>
      <button class="panel-close" onclick="toggleServers()">✕</button>
    </div>
    <div class="server-list" id="serverList"></div>
  </div>
</div>

<div class="main">
  <div class="status">
    <div><span class="status-dot" id="statusDot"></span><span class="status-title" id="statusTitle">Отключено</span></div>
    <div class="status-sub" id="statusSub">Выберите туннель</div>
  </div>

  <button class="connect-btn" id="connectBtn" onclick="toggleConnect()">
    <span class="connect-icon" id="connectIcon">⚡</span>
    <span class="connect-label" id="connectLabel">ВКЛ</span>
  </button>

  <div class="stats" id="stats">
    <div class="stat"><div class="stat-val" id="downVal">0.0</div><div class="stat-lab">Download</div></div>
    <div class="stat"><div class="stat-val" id="upVal">0.0</div><div class="stat-lab">Upload</div></div>
    <div class="stat"><div class="stat-val" id="pingVal">--</div><div class="stat-lab">Ping</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let servers = JSON.parse(localStorage.getItem('cvetik_servers')) || [
  {n:"Perm-1",c:`[Interface]
Address = 172.16.0.2/32, 2606:4700:110:8820:25dc:cd3a:4b1e:eea2/128
DNS = 1.1.1.1, 2606:4700:4700::1111, 1.0.0.1, 2606:4700:4700::1001
MTU = 1280
Jc = 5
Jmin = 100
Jmax = 200
H1 = 1
H2 = 2
H3 = 3
H4 = 4
PrivateKey = AAUpyicUZcS4fnCy2kvzVys5EgDoo5uZZdVn+cZjFko=

[Peer]
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = engage.cloudflareclient.com:4500
PublicKey = bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=`,f:"🇷🇺",p:0},
  {n:"Perm-2",c:`[Interface]
Address = 172.16.0.2/32, 2606:4700:110:8f76:f752:d90e:599f:f619/128
DNS = 1.1.1.1, 2606:4700:4700::1111, 1.0.0.1, 2606:4700:4700::1001
MTU = 1280
Jc = 5
Jmin = 100
Jmax = 200
H1 = 1
H2 = 2
H3 = 3
H4 = 4
PrivateKey = gPPcIN0hG4M0EVB5anNIvW4FWwdrpys+Vm9XRol4BlA=

[Peer]
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = engage.cloudflareclient.com:4500
PublicKey = bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=`,f:"🇷🇺",p:0}
];
let active = parseInt(localStorage.getItem('cvetik_active')) || 0;
let connected = false;
let pingInterval = null;
let statsInterval = null;

function save(){localStorage.setItem('cvetik_servers',JSON.stringify(servers));localStorage.setItem('cvetik_active',active);}

function render(){
  document.getElementById('serverList').innerHTML = servers.map((s,i)=>{
    const on = i===active ? ' on' : '';
    const pc = s.p===0 ? 'ping-load' : (s.p<100 ? 'ping-good' : (s.p<300 ? 'ping-mid' : 'ping-bad'));
    const pt = s.p===0 ? '...' : s.p+' мс';
    return `<div class="server-item${on}" onclick="sel(${i})"><div class="server-flag">${s.f}</div><div class="server-info"><div class="server-name">${s.n}</div><div class="server-addr">AmneziaWG</div></div><div class="server-ping ${pc}">${pt}</div></div>`;
  }).join('');
}

function sel(i){
  active=i;save();render();toggleServers();
  if(connected){toast('🔄 Reconnecting...');toggleConnect();setTimeout(toggleConnect,800);}
  else{document.getElementById('statusSub').textContent=servers[active].n;toast('📍 '+servers[active].n);}
}

function toggleServers(){document.getElementById('serverPanel').classList.toggle('on');}

async function pingAll(){
  for(let i=0;i<servers.length;i++){
    servers[i].p=0;render();
    try{
      if(window.AndroidVpn){
        const res=JSON.parse(window.AndroidVpn.ping(extractHost(servers[i].c)));
        servers[i].p=res.ms||999;
      }else{
        const t0=Date.now();
        try{await fetch('http://'+extractHost(servers[i].c),{mode:'no-cors',signal:AbortSignal.timeout(3000)});}catch(e){}
        servers[i].p=Date.now()-t0;
      }
    }catch(e){servers[i].p=999;}
    render();
  }
}

function extractHost(config){
  for(const line of config.split('\n')){
    if(line.trim().startsWith('Endpoint =')){
      return line.split('=')[1].trim().split(':')[0];
    }
  }
  return '1.1.1.1';
}

function startPingLoop(){
  if(pingInterval) clearInterval(pingInterval);
  pingAll();
  pingInterval = setInterval(pingAll, 5000);
}

function stopPingLoop(){
  if(pingInterval){ clearInterval(pingInterval); pingInterval = null; }
}

function toggleConnect(){
  const btn=document.getElementById('connectBtn'),icon=document.getElementById('connectIcon'),label=document.getElementById('connectLabel');
  const dot=document.getElementById('statusDot'),title=document.getElementById('statusTitle'),sub=document.getElementById('statusSub');
  const stats=document.getElementById('stats');const s=servers[active];
  if(!connected){
    if(!window.AndroidVpn){toast('❌ Native bridge not found');return;}
    toast('⏳ Connecting to '+s.n+'...');
    window.AndroidVpn.requestVpnPermission(s.c, s.n);
  }else{
    window.AndroidVpn.disconnect();
    connected=false;btn.classList.remove('on');icon.textContent='⚡';label.textContent='ON';
    dot.classList.remove('on');title.textContent='Disconnected';sub.textContent='Select tunnel';
    stats.classList.remove('on');stopReal();stopPingLoop();toast('❌ Disconnected');
  }
}

function onVpnConnected(){
  const btn=document.getElementById('connectBtn'),icon=document.getElementById('connectIcon'),label=document.getElementById('connectLabel');
  const dot=document.getElementById('statusDot'),title=document.getElementById('statusTitle'),sub=document.getElementById('statusSub');
  const stats=document.getElementById('stats');const s=servers[active];
  connected=true;btn.classList.add('on');icon.textContent='✓';label.textContent='OFF';
  dot.classList.add('on');title.textContent='Connected';sub.textContent=s.n;
  stats.classList.add('on');startReal();startPingLoop();toast('✅ '+s.n);
}

function onVpnDenied(){
  toast('🔒 Please allow VPN in system dialog');
}

function startReal(){
  if(statsInterval) clearInterval(statsInterval);
  statsInterval = setInterval(()=>{
    try{if(window.AndroidVpn){
      const r=JSON.parse(window.AndroidVpn.getStats());
      document.getElementById('downVal').textContent=fmt(r.rx);
      document.getElementById('upVal').textContent=fmt(r.tx);
      document.getElementById('pingVal').textContent=servers[active].p+' ms';
    }}catch(e){}
  },1000);
}
function stopReal(){if(statsInterval){clearInterval(statsInterval);statsInterval=null;}}
function fmt(b){if(!b||b<0)return'0.0';const m=b/(1024*1024);if(m<1)return(b/1024).toFixed(1)+' KB';return m.toFixed(1)+' MB';}

let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3000);}

render();
document.getElementById('statusSub').textContent=servers[active]?servers[active].n:'Select tunnel';
pingAll();
</script>
</body>
</html>
